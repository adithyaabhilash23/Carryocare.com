<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CarryO Care — Journey Animation Preview</title>
  
  <!-- Optional Google Font (DM Sans). The animation falls back to system sans-serif if omitted. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Journey Animation Stylesheet -->
  <link rel="stylesheet" href="./carryo-journey-animation.css">

  <style>
    /* Demo preview shell (not part of the animation itself) */
    body {
      margin: 0;
      padding: 40px 20px;
      background: #faf8f5;
      color: #1c2d37;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .preview-container {
      width: 100%;
      max-width: 1160px;
    }

    .preview-header {
      margin-bottom: 24px;
      text-align: center;
    }

    .preview-title {
      font-size: 24px;
      font-weight: 600;
      margin: 0 0 8px 0;
      color: #1c2d37;
    }

    .preview-subtitle {
      font-size: 14px;
      color: #475b66;
      margin: 0;
    }
  </style>
</head>
<body>

  <div class="preview-container">
    <div class="preview-header">
      <h1 class="preview-title">CarryO Care Journey Animation</h1>
      <p class="preview-subtitle">Self-contained SVG SMIL + CSS route animation</p>
    </div>

    <!-- ================================================================= -->
    <!-- START: CarryO Care Journey Animation (Copy from here into your HTML) -->
    <!-- ================================================================= -->
    <div
      class="map-scene"
      role="img"
      aria-label="Illustrated journey: a CarryO Care vehicle travels from home to hospital, where a companion waits, and returns home with you."
    >
      <div class="map-caption">
        <span class="map-caption-dot"></span> A little care, all the way home
      </div>

      <svg
        class="journey-map"
        viewBox="0 0 760 440"
        fill="none"
        aria-hidden="true"
        xmlns="http://www.w3.org/2000/svg"
      >
        <defs>
          <pattern
            id="map-dots"
            width="28"
            height="28"
            patternUnits="userSpaceOnUse"
          >
            <circle cx="1" cy="1" r="1" class="map-dot" />
          </pattern>
          <path
            id="outward-path"
            d="M116 283C178 216 234 180 307 190C390 202 407 112 496 112C551 112 586 146 628 182"
          />
          <path
            id="return-path"
            d="M628 215C563 278 522 323 446 305C353 282 343 360 255 350C198 344 162 316 116 296"
          />
        </defs>

        <!-- Map Background Pattern -->
        <rect
          x="24"
          y="24"
          width="712"
          height="392"
          rx="22"
          fill="url(#map-dots)"
        />

        <!-- Topographic Contour Lines -->
        <path
          d="M68 99C149 142 196 108 267 130S384 148 449 73s136-30 219 4M62 369c87-63 148-42 229-69s124-16 188 34 126 51 203-6M76 228c67-38 112-26 153-7s91 19 131-18 84-47 137-25 94 25 177-3"
          class="contour-line"
        />

        <!-- Route Soft Underlays -->
        <path
          d="M114 285C176 218 236 181 307 193c81 14 101-79 189-79 55 0 91 34 131 69"
          class="route-underlay"
        />
        <path
          d="M628 215c-65 63-106 108-182 90-93-23-103 55-191 45-57-6-93-34-139-54"
          class="route-underlay"
        />

        <!-- Animated Dashed Route Strokes -->
        <use href="#outward-path" class="route-stroke route-outward" />
        <use href="#return-path" class="route-stroke route-return" />

        <!-- HOME Marker -->
        <g class="map-home">
          <circle cx="116" cy="289" r="34" class="home-halo" />
          <circle cx="116" cy="289" r="22" class="home-marker" />
          <path
            d="m105 288 11-9 11 9v11h-8v-8h-7v8h-7v-11Z"
            class="home-icon"
          />
          <rect
            x="76"
            y="337"
            width="80"
            height="27"
            rx="13.5"
            class="map-label-bg"
          />
          <text x="116" y="355" text-anchor="middle" class="map-label">
            HOME
          </text>
        </g>

        <!-- HOSPITAL Marker -->
        <g class="map-hospital">
          <circle cx="628" cy="199" r="35" class="hospital-halo" />
          <circle cx="628" cy="199" r="23" class="hospital-marker" />
          <path d="M618 190h5v-3h10v3h5v20h-7v-6h-6v6h-7Zm8.5 2h3v2.5h2.5v3h-2.5v2.5h-3v-2.5h-2.5v-3h2.5Z" fill-rule="evenodd" class="hospital-icon" />
          <rect
            x="576"
            y="246"
            width="104"
            height="27"
            rx="13.5"
            class="map-label-bg"
          />
          <text x="628" y="264" text-anchor="middle" class="map-label">
            HOSPITAL
          </text>
        </g>


        <!-- Moving Vehicle with Bidirectional Journey & Upright Orientation -->
        <g class="moving-vehicle" aria-hidden="true">
          <animateMotion
            dur="12s"
            repeatCount="indefinite"
            rotate="auto"
            keyPoints="0;0.485;0.485;0.515;0.515;1"
            keyTimes="0;0.44;0.48;0.52;0.56;1"
            calcMode="linear"
            path="M116 283C178 216 234 180 307 190C390 202 407 112 496 112C551 112 586 146 628 182 C636 191 636 206 628 215 C563 278 522 323 446 305C353 282 343 360 255 350C198 344 162 316 116 296"
          />
          <g class="vehicle-flip">
            <animateTransform
              attributeName="transform"
              type="scale"
              calcMode="discrete"
              values="1 1; 1 1; 1 -1; 1 -1"
              keyTimes="0;0.49;0.51;1"
              dur="12s"
              repeatCount="indefinite"
            />
            <rect
              x="-20"
              y="-11"
              width="40"
              height="22"
              rx="8"
              class="vehicle-body"
            />
            <path
              d="M-9-8h12v7h-18v-3a4 4 0 0 1 4-4ZM5-8h7a4 4 0 0 1 4 4v3H5v-7Z"
              class="vehicle-windows"
            />
            <circle cx="-10" cy="11" r="3" class="vehicle-wheel" />
            <circle cx="10" cy="11" r="3" class="vehicle-wheel" />
            <path d="M0-5v8m-4-4h8" class="vehicle-cross" />
          </g>
        </g>

        <!-- Companion Waypoint Marker -->
        <g class="companion-marker">
          <circle cx="379" cy="221" r="19" class="companion-halo" />
          <circle cx="379" cy="216" r="5" class="companion-icon" />
          <path
            d="M369 232c1-7 5-10 10-10s9 3 10 10"
            class="companion-icon"
          />
        </g>
        <rect
          x="330"
          y="250"
          width="98"
          height="25"
          rx="12.5"
          class="map-label-bg map-label-tag"
        />
        <text
          x="379"
          y="267"
          text-anchor="middle"
          class="map-label map-label-small"
        >
          BY YOUR SIDE
        </text>
      </svg>

      <!-- Legend -->
      <div class="map-legend">
        <span>
          <i class="legend-dot legend-home"></i> Home
        </span>
        <span>
          <i class="legend-dot legend-care"></i> Accompanied journey
        </span>
        <span>
          <i class="legend-dot legend-return"></i> Safe return
        </span>
      </div>
    </div>
    <!-- ================================================================= -->
    <!-- END: CarryO Care Journey Animation -->
    <!-- ================================================================= -->

  </div>

</body>
</html>
